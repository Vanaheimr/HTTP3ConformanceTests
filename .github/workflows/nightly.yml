name: Nightly

# The counterpart to ci.yml, which gates every push against the submodule revision the gitlink
# pins. This workflow runs the lane that cannot gate a merge — the one that reaches eight public
# HTTP/3 servers on the open internet — plus the question the gate structurally cannot ask: does
# this repository still agree with Hermod's *current* master, rather than with the revision it
# pins?
#
# That second question is not hypothetical here. This repository began the day pinned 75 commits
# behind Hermod, against a revision where HTTPMethod had since become a type; H3Server no longer
# compiled against master and nothing reported it. Our gate was green because it tests the pin,
# and Hermod's gate was green because a push there does not touch this repository at all.
#
# Two things worth knowing about scheduled workflows: they only ever run on the default branch,
# and GitHub disables them after 60 days without any repository activity. If this stops
# reporting, that is the first thing to check.
on:
  schedule:
    # 02:43 UTC — after Hermod's nightly, and off the hour, where GitHub's
    # scheduler is busiest and delays runs by tens of minutes.
    - cron: '43 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:

  # ---------------------------------------------------------------------------
  # Everything against the pinned submodules, on both platforms.
  # ---------------------------------------------------------------------------
  full-suite:
    # The same two legs as the gate — see ci.yml for why Debian is a container.
    # Repeating the gated set here is not redundancy: running it a second time,
    # hours later, on a differently loaded runner, is what makes a test that
    # only fails sometimes eventually fail where someone can see it.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    name: full-suite (${{ matrix.leg }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # git BEFORE the checkout: without it actions/checkout falls back to a REST
      # tarball, and a tarball has no submodules — see ci.yml.
      - name: Install prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build HTTP3ConformanceTests.slnx --configuration Release

      # Fatal: the same set the gate runs.
      - name: Test (HTTP/3 + QUIC, in process)
        timeout-minutes: 30
        run: dotnet test libs/Hermod/HermodTests/HermodTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Hermod.Tests.HTTP3|FullyQualifiedName~Hermod.Tests.QUIC" --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}.trx" --results-directory artifacts

      # Fatal: the harnesses, against a real server over real UDP. One runner, in bash,
      # on both legs — see the note in ci.yml for why the PowerShell twin was removed
      # rather than kept in step.
      - name: Harnesses
        timeout-minutes: 20
        shell: bash
        run: tests/run-tests.sh --no-build

      # Gated since 2026-10-04, at the floor h3interop itself enforces: its exit code goes
      # non-zero below 6/8. This step used to be informational because a hosted runner is not a
      # normal client and nobody had measured how abnormal — the 54 artifacts accumulated since
      # 2026-08-13 are that measurement: 53 nights of 8/8, one 7/8 from a single mvfst GOAWAY,
      # never two hosts down at once, and the feared Akamai/Outlook bot protection never fired.
      # Two unreachable hosts still pass — double the worst night ever measured, because a
      # network gate that cries wolf gets clicked away. Three gone at once has never been
      # weather: it means our client, the runner's egress as a whole, or a third of the public
      # HTTP/3 world, and each of those deserves a red night.
      #
      # Windows only: one matrix leg is enough to answer "can our client still
      # talk to these eight", and running it twice would double the load on
      # somebody else's servers for no extra information.
      - name: Client interop matrix (floor 6/8)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p artifacts
          status=0
          dotnet run --project tests/h3interop --configuration Release --no-build 2>&1 | tee artifacts/interop.txt || status=$?
          {
            echo '## Client interop matrix (floor 6/8)'
            echo
            echo 'Network-dependent, so the floor is deliberately low: red takes three of eight gone at once.'
            echo
            echo '```'
            cat artifacts/interop.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      # One artifact per leg. The interop output exists nowhere else once the
      # console log ages out, and the step summary is only comfortable to read
      # while the run is the newest one — but a baseline is not a thing one
      # reads, it is a thing one accumulates. 54 of them bought the 6/8 floor
      # above; they keep accumulating so the next tightening has its evidence too.
      #
      # !cancelled() rather than success(): a red night is when this matters most.
      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-${{ matrix.leg }}
          path: |
            artifacts/*.trx
            artifacts/interop.txt

  # ---------------------------------------------------------------------------
  # The referee job: the same suite against Hermod's current master.
  # ---------------------------------------------------------------------------
  against-hermod-master:
    # The job above tests the revision the gitlink pins, which is the right
    # question for "would a fresh clone build". It is the wrong question for what
    # this repository is now that the stack has moved out of it: an independent
    # suite that can be pointed at any Hermod revision. Nothing else asks it —
    # a push to Hermod does not touch this repository, and a bump only happens
    # when a human decides to make one.
    #
    # So: check the submodules out at master and run against them. Red here means
    # Hermod changed in a way this repository disagrees with. That is a finding,
    # not a broken build, which is why it is a separate job and why the network
    # lane is left out of it. One question at a time.
    #
    # Windows, unlike the DNS and NTS equivalents: h3semantics drives our server
    # with msquic, and the container has no libmsquic. The most interesting half
    # of the referee's evidence only exists on this leg.
    name: against-hermod-master
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Move the submodules to master
        shell: bash
        run: |
          git config --global --add safe.directory '*'
          git submodule foreach 'git fetch origin master && git checkout FETCH_HEAD'
          {
            echo '### Submodule revisions under test'
            echo
            echo '```'
            git submodule status
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      # The build is half the answer on its own. What started this workflow was a
      # compile error against a moved Hermod, not a failing test.
      - name: Build
        run: dotnet build HTTP3ConformanceTests.slnx --configuration Release

      - name: Test (HTTP/3 + QUIC, in process)
        timeout-minutes: 30
        run: dotnet test libs/Hermod/HermodTests/HermodTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Hermod.Tests.HTTP3|FullyQualifiedName~Hermod.Tests.QUIC" --logger "console;verbosity=normal" --logger "trx;LogFileName=against-hermod-master.trx" --results-directory artifacts

      - name: Harnesses
        timeout-minutes: 20
        shell: bash
        run: tests/run-tests.sh --no-build

      - name: Upload results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: nightly-against-hermod-master
          path: artifacts/*.trx
