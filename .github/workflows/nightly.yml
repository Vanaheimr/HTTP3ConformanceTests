name: Nightly

# ci.yml gates every push with the 247 in-process HTTP/3 tests. Those never
# touch the network, which is what makes them a gate — and also what they
# cannot tell us: whether the stack still talks to implementations that were
# not written here.
#
# This workflow answers that, and only that. It reaches eight public HTTP/3
# servers of eight different QUIC stacks, so it is allowed to be flaky in a way
# a gate must not be.
#
# Two things worth knowing about scheduled workflows: they only ever run on the
# default branch, and GitHub disables them after 60 days without any repository
# activity. If this stops reporting, that is the first thing to check.
on:
  schedule:
    # 02:43 UTC — after Hermod's nightly, and off the hour, where GitHub's
    # scheduler is busiest and delays runs by tens of minutes.
    - cron: '43 2 * * *'
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  interop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build samples/H3Get/H3Get.csproj --configuration Release

      # The client interop matrix — see INTEROP.md. Fresh connection per target,
      # FULL certificate chain and hostname validation, no -k.
      #
      # Note what this does NOT gate on: H3Get exits non-zero only when ALL
      # eight stacks are unreachable, so a night where six of eight broke still
      # ends green. That threshold is deliberately not tightened yet — nobody
      # has measured how many of these eight answer a datacentre IP at all.
      # Akamai and Outlook run bot protection that treats hosted runners
      # differently from a residential line, and picking a threshold before
      # seeing the baseline would just produce a red that gets clicked away.
      # Read the summary below for a few nights, then set one.
      - name: Client interop matrix
        timeout-minutes: 15
        shell: bash
        run: |
          mkdir -p artifacts
          dotnet run --project samples/H3Get --configuration Release --no-build -- --interop 2>&1 | tee artifacts/interop.txt
          {
            echo '## Client interop matrix'
            echo
            echo '```'
            cat artifacts/interop.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The step summary above is the same text, but it is only comfortable to read while the
      # run is the newest one; older summaries need a signed-in browser session, and nothing
      # compares two nights without opening both.
      #
      # That comparison is the open item. The threshold note above says this workflow cannot
      # gate on a failure count until someone knows how many of the eight answer a hosted
      # runner on a normal night — and a baseline is not a thing one reads, it is a thing one
      # accumulates. `gh run download` over a few nights of these files produces it.
      #
      # !cancelled() rather than success(): a night where the step timed out or half the
      # targets refused is precisely the night whose output is worth keeping.
      - name: Upload interop output
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: interop-matrix
          path: artifacts/interop.txt

      # Deliberately absent: the server side. INTEROP.md probes our own server
      # with an HTTP/3-capable curl, but the curl preinstalled on windows-latest
      # is a Schannel build WITHOUT HTTP/3 — it would report a failure that says
      # nothing about our server. Adding this back means installing a real
      # HTTP/3 curl in the job first.
