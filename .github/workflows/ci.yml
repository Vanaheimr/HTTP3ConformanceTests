name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # Manual runs from the Actions tab ("Run workflow"), same as nightly.yml.
  # This gate builds against a submodule pin, so the useful manual case is not
  # "run it again" but "run it unchanged after Hermod moved" — checking out a
  # pin that has not been bumped yet is exactly what the button is for.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # Two legs, the same pair Hermod and Styx gate on:
    #
    #  * windows-latest, the platform this suite has been verified on longest.
    #    Certificate chain building goes through Schannel and CryptoAPI here,
    #    which behaves differently from OpenSSL — the Ed25519 chain difference
    #    was found on this leg.
    #  * Debian 13, because that is what this runs on in production. GitHub
    #    offers no Debian image, so the leg runs in a bare debian:13 container
    #    on an Ubuntu runner — the same container both sibling repositories use,
    #    so all three gates test the same platform pair.
    #
    # The earlier note here said Linux was worth adding "but not before someone
    # has actually seen it pass there". Someone has: Debian 13.6 builds the
    # whole solution with 0 errors and runs 246 passed / 0 failed, with
    # AChainTheePlatformCannotBuild skipped — which is that Schannel/OpenSSL
    # difference showing up as a skip rather than a failure. 247 on Windows,
    # 246 + 1 skip here; the .trx artifacts name both.
    #
    # fail-fast is off on purpose: "red on exactly one platform" is the most
    # valuable signal this matrix produces, so one leg must not cancel the other.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            leg: windows-latest
          - os: ubuntu-latest
            container: debian:13
            leg: debian-13-container
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      # git BEFORE checkout, and that ordering is the whole trick on this leg:
      # without it actions/checkout falls back to downloading a source tarball
      # over the REST API, and a tarball has no submodules — so the checkout
      # would "succeed" and then nothing would compile. The rest are the .NET
      # prerequisites the bare container lacks: curl for the install script, ICU
      # and tzdata for globalization, OpenSSL for crypto, ca-certificates for
      # NuGet over HTTPS. Package names verified on Debian 13 (trixie).
      - name: Install prerequisites (Debian container)
        if: runner.os == 'Linux'
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git libicu76 libssl3t64 libstdc++6 tzdata

      # The QUIC/TLS stack lives in the Hermod submodule, Styx below that —
      # without a recursive checkout nothing here compiles at all.
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build HTTP3ConformanceTests.slnx --configuration Release

      # The stack itself now lives in the submodule and Hermod's own CI runs its
      # whole suite. What this gate adds is the pinned submodule commit: the
      # samples must still compile against it, and its 247 HTTP/3 tests must still
      # pass. None of them touch the network — the stack is exercised in-process
      # against our own QUIC server — so this is a real gate, not a connectivity
      # check.
      - name: Test (HTTP/3)
        run: dotnet test libs/Hermod/HermodTests/HermodTests.csproj --configuration Release --no-build --filter "FullyQualifiedName~Hermod.Tests.HTTP3" --logger "console;verbosity=normal" --logger "trx;LogFileName=${{ matrix.leg }}.trx" --results-directory artifacts

      # The out-of-process half of the gate: two harnesses driving a real H3Server over real UDP,
      # one of them with a client nobody here wrote (msquic, via .NET's HttpClient). They cover what
      # the in-process suite structurally cannot — the socket, the demux, the listener's decision to
      # create state or refuse it, and the server staying alive under datagrams no cooperating peer
      # would send.
      #
      # Windows only. The Debian leg runs in a bare container where System.Net.Quic finds no
      # libmsquic, and h3semantics reports SKIP there rather than a green 0/0 — worth having as a
      # signal, not worth a job that reports nothing. The transport-level scenarios in h3attack need
      # no QUIC client at all and would run, but splitting the pair across legs buys little.
      - name: Harnesses (out of process)
        if: runner.os == 'Windows'
        run: pwsh tests/run-tests.ps1 -NoBuild

      # The console log answers "did it pass" and almost nothing else: which test failed takes
      # grepping the step log, and a skip reason never reaches the console at normal verbosity
      # at all. TRX keeps outcome, duration, error message, stack trace and the Assert.Ignore
      # text per test, and `gh run download` fetches it without a signed-in browser session.
      #
      # It earns its place here for a reason the sibling gates do not have: this job tests code
      # that lives in another repository, at a pin this one chooses. When Hermod's own gate is
      # green and this one is red, the difference is the pin — and the files are named after the
      # same two legs Hermod and Styx use, so all of them are directly comparable.
      #
      # It also carries the one thing the console hides on the Debian leg: a skip reason. The
      # difference between "246 passed, 1 skipped because OpenSSL cannot build that chain" and
      # "246 passed, 1 quietly missing" is only visible in the .trx.
      #
      # !cancelled() rather than success(): a red run is when these files matter most, and a
      # build that fails before the test step leaves no .trx, which upload-artifact reports as
      # a warning rather than a second failure — the compile error is the finding there.
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.leg }}
          path: artifacts/*.trx
